# La test suite del plugin come CI: gira a ogni push su main/develop e su ogni
# pull request. Avvio manuale da "Actions → tests → Run workflow".
# Il test di freshness fiscale è escluso (--skip freshness): scade per design
# dopo 12 mesi e non deve bloccare PR non correlate. Lo esegue freshness.yml,
# schedulato ogni mese, che apre una issue quando i dati vanno riverificati.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un solo run per branch/PR: un push nuovo cancella quello in corso.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    # Il minimo dichiarato nel README e la versione più recente: t_compila compila
    # tutti gli script con l'interprete del job, quindi una sintassi solo-3.12 emerge qui.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      # LibreOffice per i test che ricalcolano gli Excel (scripts/ricalcola-excel.py).
      # I .deb restano in cache tra un run e l'altro: su alcuni runner il mirror li
      # serve a ~70 KB/s (perché e come, in scripts/installa-libreoffice.sh). Oltre
      # i 10 minuti lo step fallisce invece di restare appeso.
      - name: Ripristina i .deb di LibreOffice
        id: deb-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/apt-libreoffice
          key: apt-libreoffice-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: apt-libreoffice-${{ runner.os }}-${{ runner.arch }}-
      - name: Installa LibreOffice Calc
        id: libreoffice
        timeout-minutes: 10
        run: bash scripts/installa-libreoffice.sh /tmp/apt-libreoffice
      - name: Salva i .deb di LibreOffice
        if: steps.libreoffice.outputs.chiave != steps.deb-cache.outputs.cache-matched-key
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/apt-libreoffice
          key: ${{ steps.libreoffice.outputs.chiave }}
      - run: python tests/run_tests.py --skip freshness
        env:
          RICHIEDI_LIBREOFFICE: "1"   # in CI i test degli Excel non si saltano

  # Windows: script e suite devono girare anche con una console cp1252 e i percorsi con
  # la barra rovesciata. Una sola versione di Python (il minimo dichiarato) e niente
  # LibreOffice: i test che ricalcolano gli Excel risultano saltati, li copre il job ubuntu.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python tests/run_tests.py --skip freshness

  # Il ruleset di main e develop chiede un check che si chiama «test»: i job della matrice si
  # chiamano «suite (3.11)» e «suite (3.14)», quindi questo job li riassume. È verde solo se lo
  # sono tutti, Windows compreso: con !cancelled() un job a monte fallito lo fa fallire invece di
  # saltarlo (un check saltato varrebbe come superato), e un run annullato non dà un falso rosso.
  test:
    if: ${{ !cancelled() }}
    needs: [suite, test-windows]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "suite: ${{ needs.suite.result }} · test-windows: ${{ needs.test-windows.result }}"
          [ "${{ needs.suite.result }}" = success ] && [ "${{ needs.test-windows.result }}" = success ]

  # Il manifest del plugin passa `claude plugin validate --strict`: anche i warning
  # (campi sconosciuti, nomi non kebab-case) bloccano. Evita di scoprire un plugin.json
  # rotto solo all'installazione. Il solo avviso ammesso è ICON_MISSING del controllo
  # per il plugin directory, che non cambia l'esito (l'icona non si aggiunge, per decisione del proprietario).
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.305   # versione fissata: aggiornarla a mano
      - run: claude plugin validate . --strict
