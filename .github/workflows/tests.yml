# La test suite del plugin come CI: gira a ogni push su main/develop e su ogni
# pull request. Avvio manuale da "Actions → tests → Run workflow".
# Nota voluta: il test di freshness fiscale FALLIRÀ quando i marcatori
# "Verificato: AAAA-MM" superano i 12 mesi — un badge rosso qui significa
# "riverificare i dati normativi alle fonti", non un bug.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un solo run per branch/PR: un push nuovo cancella quello in corso.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python tests/run_tests.py
