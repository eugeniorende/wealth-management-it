# La test suite del plugin come CI: gira a ogni push su main/develop e su ogni
# pull request. Avvio manuale da "Actions → tests → Run workflow".
# Il test di freshness fiscale è escluso (--skip freshness): scade per design
# dopo 12 mesi e non deve bloccare PR non correlate. Lo esegue freshness.yml,
# schedulato ogni mese, che apre una issue quando i dati vanno riverificati.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un solo run per branch/PR: un push nuovo cancella quello in corso.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Il minimo dichiarato nel README e la versione più recente: t_compila compila
    # tutti gli script con l'interprete del job, quindi una sintassi solo-3.12 emerge qui.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      # LibreOffice per i test che ricalcolano gli Excel (scripts/ricalcola-excel.py).
      - name: Installa LibreOffice Calc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
      - run: python tests/run_tests.py --skip freshness
        env:
          RICHIEDI_LIBREOFFICE: "1"   # in CI i test degli Excel non si saltano

  # Il manifest del plugin passa `claude plugin validate` (errori bloccano,
  # i warning no). Evita di scoprire un plugin.json rotto solo all'installazione.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.305   # versione fissata: aggiornarla a mano
      - run: claude plugin validate .
