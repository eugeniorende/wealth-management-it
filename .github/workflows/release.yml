# Release del plugin. Gitflow: release branch da develop → PR su main → tag vX.Y.Z
# su main. Il push del tag fa partire questo workflow, che:
#   1. verifica che il tag coincida con la versione in plugin.json;
#   2. esegue la suite COMPLETA, freshness inclusa (non si rilascia con dati
#      normativi scaduti: è l'unico posto in cui quel test blocca);
#   3. costruisce lo zip per Cowork con scripts/pacchetto.py;
#   4. crea la GitHub Release con lo zip allegato e le note generate dai commit.
# Avvio manuale = prova: costruisce lo zip e lo carica come artifact del run,
# senza creare la release. Serve a collaudare il workflow prima del primo tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Il minimo dichiarato nel README, dentro la matrice di tests.yml (un test di igiene lo controlla).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      # LibreOffice per i test che ricalcolano gli Excel (scripts/ricalcola-excel.py).
      # Cache dei .deb e timeout come in tests.yml (qui la cache si legge soltanto):
      # un mirror lento non blocca il rilascio.
      - name: Ripristina i .deb di LibreOffice
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/apt-libreoffice
          key: apt-libreoffice-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: apt-libreoffice-${{ runner.os }}-${{ runner.arch }}-
      - name: Installa LibreOffice Calc
        timeout-minutes: 10
        run: bash scripts/installa-libreoffice.sh /tmp/apt-libreoffice

      - name: Suite completa (freshness inclusa)
        run: python tests/run_tests.py
        env:
          RICHIEDI_LIBREOFFICE: "1"

      - name: Costruisci lo zip per Cowork
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python scripts/pacchetto.py --out dist --tag "${{ github.ref_name }}"
          else
            python scripts/pacchetto.py --out dist
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "${{ github.ref_name }}" --generate-notes
